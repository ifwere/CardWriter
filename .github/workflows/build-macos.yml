name: Build macOS (Intel)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Intel (x86_64) macOS runner. The produced app targets macOS 12+.
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Elm home
        uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('elm.json') }}
          restore-keys: |
            elm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Checks, typecheck and unit tests
        run: |
          npm run check
          npm run typecheck
          npm test

      - name: Build application
        run: |
          chmod +x src/bin/mac/pandoc
          npm run build

      - name: Electron smoke tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore

      # Unsigned, unnotarized x64 dmg + zip.
      - name: Package for macOS
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CardWriter-macos-x64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
