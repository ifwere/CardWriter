name: Build macOS (Intel)

# Runs on every push so the workflow is always visible in the Actions tab.
# The release step below is gated on a version tag, so ordinary pushes only
# build and test; only a v* tag publishes a GitHub Release.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Intel (x86_64) macOS runner. The produced app targets macOS 12+.
    runs-on: macos-15-intel
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Checks, typecheck and unit tests
        run: |
          npm run check
          npm run typecheck
          npm test

      - name: Build application
        run: |
          chmod +x src/bin/mac/pandoc
          npm run build

      - name: Electron smoke tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore

      # Unsigned, unnotarized x64 dmg + zip. The package produces CardWriter.app.
      - name: Package for macOS
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Publish a Release holding both the .zip and .dmg of the tagged version.
      # Only runs for version tags; ordinary pushes stop before this step.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
